<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'self';" />
<title>CCIMUNS — Member Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #c0c0c0;
    font-family: "Times New Roman", Times, Georgia, serif;
    color: #000;
  }

  .retro-window {
    background: #c0c0c0;
    border: 3px outset #ffffff;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .win-titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    padding: 4px 8px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 32px;
    flex-shrink: 0;
  }
  .win-controls {
    display: flex;
    gap: 6px;
  }
  .win-body {
    display: flex;
    flex: 1;
    height: calc(100vh - 32px);
    overflow: hidden;
  }

  .sidebar {
    width: 65px;
    background: #d4d0c8;
    border-right: 2px inset #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    user-select: none;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 38px;
    height: 38px;
    border: 2px outset #fff;
    background: #000080;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 15px;
  }
  .sidebar-text {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 22px;
    letter-spacing: 4px;
    color: #000;
  }

  .main-panel {
    flex: 1;
    background: #ffffff;
    border: 2px inset #7f9db9;
    margin: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .page-header {
    border-bottom: 2px solid #000;
    padding-bottom: 6px;
    margin-bottom: 16px;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .user-banner {
    background: #ffffcc;
    border: 1px dashed #000;
    padding: 6px 12px;
    margin-bottom: 14px;
    font-size: 16px;
  }

  .portal-links {
    list-style: none;
    margin: 15px 0;
  }
  .portal-links li {
    margin-bottom: 14px;
    font-size: 18px;
  }
  .portal-links a {
    color: #0000ee;
    text-decoration: underline;
    cursor: pointer;
  }
  .portal-links a:hover {
    color: #ff0000;
  }

  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 4px;
    font-size: 15px;
  }
  input[type="text"], input[type="password"], select, textarea {
    width: 100%;
    padding: 6px;
    border: 2px inset #7f9db9;
    background: #fff;
    font-family: inherit;
    font-size: 14px;
  }
  textarea {
    resize: vertical;
    min-height: 120px;
  }

  .btn {
    background: #d4d0c8;
    border: 2px outset #ffffff;
    padding: 4px 12px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    color: #000;
  }
  .btn:active {
    border-style: inset;
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    border-style: solid;
  }

  .thread-box {
    border: 2px inset #7f9db9;
    background: #f9f9f9;
    flex: 1;
    min-height: 250px;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 12px;
    font-family: monospace;
  }
  .thread-msg {
    margin-bottom: 8px;
    border-bottom: 1px dotted #ccc;
    padding-bottom: 4px;
  }
  .thread-msg span {
    font-weight: bold;
    color: #000080;
  }

  .portal-footer {
    margin-top: auto;
    border-top: 2px solid #000;
    padding-top: 8px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
  }

  .login-overlay {
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
    background: #c0c0c0;
  }
  .login-box {
    width: 380px;
    border: 3px outset #ffffff;
    background: #c0c0c0;
    padding: 15px;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
  }
  .error-msg {
    color: #cc0000;
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 13px;
  }

  .cookie-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: grid;
    place-items: center;
    z-index: 9999;
  }
  .cookie-box {
    width: 440px;
    background: #c0c0c0;
    border: 3px outset #ffffff;
    padding: 12px;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
  }
  .cookie-header {
    background: #000080;
    color: #fff;
    padding: 3px 6px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    margin: -12px -12px 10px -12px;
  }
  .cookie-content {
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .sec-notice {
    background: #fff0f0;
    border: 1px solid #ff0000;
    padding: 8px;
    font-size: 12px;
    margin-bottom: 12px;
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
function escapeHTML(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function hashPassword(plainText) {
  const encoder = new TextEncoder();
  const data = encoder.encode(plainText);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

let ACCOUNTS = [];

(async function initAccountHashes() {
  const rawAccounts = [
    { username: "acikel", pass: "Wertxc1121", name: "Acikel" },
    { username: "ozturk", pass: "aylavmayvayfamk", name: "Ozturk" },
    { username: "adenauer", pass: "ilovebeerwii", name: "Adenauer" },
    { username: "gagnon", pass: "harvardropsupremacy", name: "Gagnon" },
    { username: "emir", pass: "whatthehellisthimunisaid", name: "Emir" }
  ];

  ACCOUNTS = await Promise.all(rawAccounts.map(async acc => ({
    username: acc.username,
    passwordHash: await hashPassword(acc.pass),
    name: acc.name
  })));
})();

let state = {
  currentUser: null,
  currentPage: 'portal',
  pageHistory: ['portal'],
  loginError: '',
  cookieAccepted: false,
  announcements: [
    { title: "Expect the B3 Summit", body: "Details regarding delegate allocations will be shared shortly.", contact: "myidolmyidol1@gmail.com" },
    { title: "Don't Forget To check out Besmun '26!", body: "Check out Insta, the applications open in September.", contact: "See Instagram" }
  ],
  threadMessages: [
    { user: "Acikel", text: "Welcome to the updated CCIMUNS console thread." },
    { user: "Ozturk", text: "Report reviews are currently pending." },
    { user: "Emir", text: "Field logistics updated." }
  ]
};

function acceptCookies() {
  state.cookieAccepted = true;
  render();
}

async function login(e) {
  e.preventDefault();
  const u = document.getElementById('user-input').value.trim().toLowerCase();
  const p = document.getElementById('pass-input').value;
  
  const inputHash = await hashPassword(p);
  const match = ACCOUNTS.find(a => a.username === u && a.passwordHash === inputHash);
  
  if (match) {
    state.currentUser = match;
    state.loginError = '';
    state.currentPage = 'portal';
    state.pageHistory = ['portal'];
    render();
  } else {
    state.loginError = 'Invalid credentials specified.';
    render();
  }
}

function logout() {
  state.currentUser = null;
  state.currentPage = 'portal';
  state.pageHistory = ['portal'];
  render();
}

function setPage(page) {
  if (state.currentPage !== page) {
    state.pageHistory.push(page);
    state.currentPage = page;
    render();
  }
}

function goBack() {
  if (state.pageHistory.length > 1) {
    state.pageHistory.pop();
    state.currentPage = state.pageHistory[state.pageHistory.length - 1];
    render();
  }
}

function submitAnnouncement(e) {
  e.preventDefault();
  const title = document.getElementById('ann-title').value;
  const body = document.getElementById('ann-body').value;
  const contact = document.getElementById('ann-contact').value;
  if (title && body) {
    state.announcements.unshift({ title, body, contact });
    setPage('announcements');
  }
}

function submitReport(e) {
  e.preventDefault();
  alert('Report filed successfully.');
  setPage('portal');
}

function submitThreadMessage(e) {
  e.preventDefault();
  const input = document.getElementById('thread-input');
  if (input.value.trim()) {
    state.threadMessages.push({ user: state.currentUser.name, text: input.value.trim() });
    input.value = '';
    render();
  }
}

function renderCookieBanner() {
  if (state.cookieAccepted) return '';
  return `
    <div class="cookie-modal-overlay">
      <div class="cookie-box">
        <div class="cookie-header">GitHub Pages Privacy Notice</div>
        <div class="cookie-content">
          <p><b>Static Hosting & Privacy Notice:</b></p>
          <p style="margin-top: 6px;">This site is statically hosted via GitHub Pages. Execution occurs purely client-side. No session credentials or submit data leave your browser context.</p>
        </div>
        <div style="text-align: right;">
          <button class="btn" onclick="acceptCookies()">Accept & Continue</button>
        </div>
      </div>
    </div>
  `;
}

function renderLogin() {
  return `
    <div class="login-overlay">
      <div class="login-box">
        <div class="win-titlebar" style="margin: -15px -15px 15px -15px;">
          <span>CCIMUNS Terminal — Authentication</span>
        </div>
        ${state.loginError ? `<div class="error-msg">${escapeHTML(state.loginError)}</div>` : ''}
        <form onsubmit="login(event)">
          <div class="form-group">
            <label for="user-input">Username:</label>
            <input type="text" id="user-input" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="pass-input">Password:</label>
            <input type="password" id="pass-input" required autocomplete="current-password">
          </div>
          <div style="text-align: right; margin-top: 15px;">
            <button type="submit" class="btn">Sign In</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function renderContent() {
  const backBtnHtml = state.currentPage !== 'portal' 
    ? `<button class="btn" onclick="goBack()">← Go Back</button>` 
    : '';

  switch (state.currentPage) {
    case 'portal':
      return `
        <div class="page-header">
          <span>Member Portal</span>
        </div>
        <p style="font-size: 18px; margin-bottom: 10px;">Welcome!</p>
        <ul class="portal-links">
          <li>* <a onclick="setPage('announcements')">Announcements!</a></li>
          <li>* <a onclick="setPage('reports')">Reports!</a></li>
          <li>* <a onclick="setPage('announce_form')">Announce! (Post Form)</a></li>
          <li>* <a onclick="setPage('main_thread')">Main Thread</a></li>
          <li>* <a onclick="setPage('affiliation')">Affiliation and More</a></li>
          <li>* <a onclick="setPage('privacy')">Privacy & Static Security Specs</a></li>
        </ul>
      `;

    case 'announcements':
      return `
        <div class="page-header">
          <span>ANNOUNCE!</span>
          ${backBtnHtml}
        </div>
        <div style="margin-bottom: 15px;">
          <button class="btn" onclick="setPage('announce_form')">+ Post New Announcement</button>
        </div>
        ${state.announcements.map(a => `
          <div style="border: 2px outset #fff; background: #e0e0e0; padding: 12px; margin-bottom: 12px;">
            <h3 style="margin-bottom: 5px;">${escapeHTML(a.title)}</h3>
            <p style="margin-bottom: 8px; font-size: 14px;">${escapeHTML(a.body)}</p>
            ${a.contact ? `<small><b>Contact:</b> ${escapeHTML(a.contact)}</small>` : ''}
          </div>
        `).join('')}
      `;

    case 'announce_form':
      return `
        <div class="page-header">
          <span>ANNOUNCE!</span>
          ${backBtnHtml}
        </div>
        <form onsubmit="submitAnnouncement(event)">
          <div class="form-group">
            <label>Announcg:</label>
            <input type="text" id="ann-title" required>
          </div>
          <div class="form-group">
            <label>Body:</label>
            <textarea id="ann-body" required></textarea>
          </div>
          <div class="form-group">
            <label>Contact:</label>
            <input type="text" id="ann-contact">
          </div>
          <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn">Post Announcement</button>
            <button type="button" class="btn" onclick="goBack()">Cancel</button>
          </div>
        </form>
      `;

    case 'reports':
      return `
        <div class="user-banner">! Logged User: ${escapeHTML(state.currentUser.name)} !</div>
        <div class="page-header">
          <span>Reports</span>
          ${backBtnHtml}
        </div>
        <form onsubmit="submitReport(event)">
          <div class="form-group">
            <label>Report Type:</label>
            <select required>
              <option value="Executive">Executive Summary</option>
              <option value="Field">Field Operations</option>
              <option value="Compliance">Compliance Audit</option>
            </select>
          </div>
          <div class="form-group">
            <label>Headline:</label>
            <input type="text" required>
          </div>
          <div class="form-group">
            <label>Body:</label>
            <textarea required></textarea>
          </div>
          <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn">Submit Report</button>
            <button type="button" class="btn" onclick="goBack()">Cancel</button>
          </div>
        </form>
      `;

    case 'main_thread':
      return `
        <div class="page-header">
          <span>MAIN THREAD</span>
          ${backBtnHtml}
        </div>
        <div class="thread-box" id="thread-box">
          ${state.threadMessages.map(m => `
            <div class="thread-msg"><span>${escapeHTML(m.user)} &gt;</span> ${escapeHTML(m.text)}</div>
          `).join('')}
        </div>
        <form onsubmit="submitThreadMessage(event)" style="display: flex; gap: 8px;">
          <input type="text" id="thread-input" placeholder="Type message..." required style="flex: 1;">
          <button type="submit" class="btn">Send</button>
        </form>
      `;

    case 'affiliation':
      return `
        <div class="page-header">
          <span>Affiliation and More</span>
          ${backBtnHtml}
        </div>
        <div style="font-size: 16px; line-height: 1.8;">
          <p><b>Affiliation:</b> acikeloguz8@gmail.com</p>
          <p><b>Inquiries:</b> myidolmyidol1@gmail.com</p>
          <hr style="margin: 15px 0; border: 1px inset #fff;">
          <h3>Appointments for Spring</h3>
          <p style="margin-top: 8px;">Spring session delegate and committee allocations are actively processing.</p>
        </div>
      `;

    case 'privacy':
      return `
        <div class="page-header">
          <span>GitHub Pages Security Policy</span>
          ${backBtnHtml}
        </div>
        <div style="font-size: 14px; line-height: 1.6;">
          <div class="sec-notice">
            <b>Static Architecture Enforcement Notice:</b><br>
            GitHub Pages serves content strictly as static files. No server-side code execution exists.
          </div>
          <p style="margin-top: 8px;"><b>Applied Controls:</b></p>
          <ul style="margin-left: 20px; margin-top: 4px;">
            <li>Client-side Web Crypto API SHA-256 password evaluation.</li>
            <li>Strict CSP Meta Policy enforcing single-origin script evaluation.</li>
            <li>Contextual HTML string escaping preventing DOM-XSS vectors.</li>
          </ul>
        </div>
      `;

    default:
      return '';
  }
}

function renderShell() {
  const canGoBack = state.pageHistory.length > 1;
  return `
    <div class="retro-window">
      <div class="win-titlebar">
        <span>CCIMUNS — Member Portal</span>
        <div class="win-controls">
          <button class="btn" style="padding: 1px 8px;" onclick="goBack()" ${!canGoBack ? 'disabled' : ''}>← Back</button>
          <button class="btn" style="padding: 1px 8px;" onclick="logout()">Logout</button>
        </div>
      </div>
      <div class="win-body">
        <div class="sidebar">
          <div class="logo-icon">CC</div>
          <div class="sidebar-text">CCIMUNS</div>
        </div>
        <div class="main-panel">
          ${renderContent()}
          <div class="portal-footer">
            <span>CCIMUNS © ALL RIGHT RESERVED</span>
            <a onclick="setPage('privacy')" style="cursor: pointer; text-decoration: underline; color: #0000ee;">Security & Privacy</a>
          </div>
        </div>
      </div>
    </div>
  `;
}

function render() {
  const container = document.getElementById('app');
  container.innerHTML = (state.currentUser ? renderShell() : renderLogin()) + renderCookieBanner();
  if (state.currentPage === 'main_thread') {
    const box = document.getElementById('thread-box');
    if (box) box.scrollTop = box.scrollHeight;
  }
}

render();
</script>
</body>
</html>
