<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCIMUNS Portal</title>
    <style>
        :root {
            --bg-primary: #01004a;
            --bg-secondary: #0f0a3a;
            --bg-card: #14145a;
            --border-color: #c9a000;
            --text-primary: #f5f0e6;
            --text-secondary: #d4b84c;
            --accent-yellow: #c9a000;
            --accent-red: #c0392b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; padding: 20px; }
        
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        h2, h3 { color: var(--accent-yellow); margin-bottom: 12px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 4px; }
        input, textarea { width: 100%; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px; border-radius: 4px; }
        textarea { height: 80px; resize: vertical; }
        
        button { background: var(--accent-yellow); color: var(--bg-primary); border: none; padding: 10px 16px; border-radius: 4px; font-weight: 700; cursor: pointer; margin-right: 8px; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: var(--accent-red); color: white; }
        
        #auth-screen { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        #auth-card { width: 100%; max-width: 360px; text-align: center; }
        #portal-screen { display: none; }
        
        .entry-item { background: rgba(0,0,0,0.2); border: 1px solid rgba(201,160,0,0.3); padding: 10px; border-radius: 4px; margin-bottom: 8px; font-size: 0.85rem; }
        .meta { font-size: 0.75rem; color: var(--text-secondary); }
    </style>
</head>
<body>

    <!-- AUTHENTICATION -->
    <div id="auth-screen">
        <div class="card" id="auth-card">
            <h2>CCIMUNS Portal</h2>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <!-- MAIN PORTAL -->
    <div id="portal-screen" class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>CCIMUNS Dashboard</h2>
            <div>
                <a href="https://chair.amunap.abrdns.com" target="_blank" style="color: var(--accent-yellow); margin-right: 15px; text-decoration: none; font-size: 0.85rem;">Chair App ↗</a>
                <button id="logout-btn" class="btn-danger">Logout</button>
            </div>
        </div>

        <!-- FORM ENTRY -->
        <div class="card">
            <h3>Submit Report / Proposal</h3>
            <form id="data-form">
                <div class="form-group">
                    <label>Type</label>
                    <select id="entry-type" style="width:100%; background:var(--bg-primary); border:1px solid var(--border-color); color:var(--text-primary); padding:8px; border-radius:4px;">
                        <option value="Report">Report</option>
                        <option value="Proposal">Proposal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Title / Target</label>
                    <input type="text" id="entry-title" required>
                </div>
                <div class="form-group">
                    <label>Content / Reason</label>
                    <textarea id="entry-body" required></textarea>
                </div>
                <button type="submit">Save Entry</button>
            </form>
        </div>

        <!-- REPOSITORY SYNC & STORAGE -->
        <div class="card">
            <h3>GitHub Data Synchronization</h3>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px;">Download the updated file and commit it directly to your repository, or load an existing repo file.</p>
            <button onclick="exportJSON()">Export data.json</button>
            <input type="file" id="import-file" onchange="importJSON(this)" style="display:none;">
            <button onclick="document.getElementById('import-file').click()" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-primary);">Import data.json</button>
        </div>

        <!-- RECORD DISPLAY -->
        <div class="card">
            <h3>Saved Entries</h3>
            <div id="records-list"></div>
        </div>
    </div>

    <script>
        // Obfuscated credential verification (Base64 encoded string comparison)
        const VALID_USERS = {
            "admin": "YWRtaW4xMjM=",      // admin123
            "chair": "cGFzc3dvcmQ=",      // password
            "delegate1": "cGFzc3dvcmQxMjM=" // password123
        };

        let activeUser = null;

        // Simple obfuscation/encryption helper
        function encodeText(text) { return btoa(unescape(encodeURIComponent(text))); }
        function decodeText(encoded) { try { return decodeURIComponent(escape(atob(encoded))); } catch(e) { return text; } }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            if (VALID_USERS[u] && VALID_USERS[u] === btoa(p)) {
                activeUser = u;
                document.cookie = "ccimuns_user=" + u + "; path=/; max-age=86400";
                showPortal();
            } else {
                alert("Invalid username or password.");
            }
        });

        document.getElementById('logout-btn').addEventListener('click', function() {
            activeUser = null;
            document.cookie = "ccimuns_user=; path=/; max-age=0";
            document.getElementById('portal-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
        });

        function showPortal() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('portal-screen').style.display = 'block';
            loadDataFromRepo();
            renderEntries();
        }

        document.getElementById('data-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const entries = JSON.parse(localStorage.getItem('ccimuns_db') || '[]');
            
            const newEntry = {
                id: Date.now(),
                type: document.getElementById('entry-type').value,
                user: encodeText(activeUser),
                title: encodeText(document.getElementById('entry-title').value.trim()),
                body: encodeText(document.getElementById('entry-body').value.trim()),
                date: new Date().toLocaleString()
            };

            entries.unshift(newEntry);
            localStorage.setItem('ccimuns_db', JSON.stringify(entries));
            document.getElementById('entry-title').value = '';
            document.getElementById('entry-body').value = '';
            renderEntries();
        });

        function renderEntries() {
            const container = document.getElementById('records-list');
            const entries = JSON.parse(localStorage.getItem('ccimuns_db') || '[]');
            container.innerHTML = entries.length === 0 ? '<div class="entry-item">No entries stored.</div>' : '';

            entries.forEach(item => {
                const div = document.createElement('div');
                div.className = 'entry-item';
                div.innerHTML = `
                    <div class="meta">[${item.type}] By: ${decodeText(item.user)} | ${item.date}</div>
                    <div style="font-weight: bold; color: var(--accent-yellow);">${decodeText(item.title)}</div>
                    <div>${decodeText(item.body)}</div>
                `;
                container.appendChild(div);
            });
        }

        // Automatic fetch attempt from static data.json in GitHub Pages repository
        function loadDataFromRepo() {
            if (!localStorage.getItem('ccimuns_db')) {
                fetch('data.json')
                    .then(response => { if (response.ok) return response.json(); throw new Error(); })
                    .then(data => {
                        localStorage.setItem('ccimuns_db', JSON.stringify(data));
                        renderEntries();
                    })
                    .catch(() => {});
            }
        }

        function exportJSON() {
            const data = localStorage.getItem('ccimuns_db') || '[]';
            const blob = new Blob([data], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'data.json';
            a.click();
        }

        function importJSON(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('ccimuns_db', e.target.result);
                renderEntries();
                alert('Database updated from imported file.');
            };
            reader.readAsText(file);
        }

        // Check active session cookie
        window.onload = function() {
            const match = document.cookie.match(/(?:^|; )ccimuns_user=([^;]*)/);
            if (match && VALID_USERS[match[1]]) {
                activeUser = match[1];
                showPortal();
            }
        };
    </script>
</body>
</html>
